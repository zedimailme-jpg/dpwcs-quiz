<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DPWCS — 50 Interactive MCQs</title>
<style>
:root{--navy:#12315b;--blue:#1f5a94;--pale:#eaf1f8;--ink:#202833;--green:#216e46;--red:#a61b1b}
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:var(--ink);font-family:Arial,"Noto Sans Devanagari",sans-serif;line-height:1.5}
header{background:var(--navy);color:#fff;padding:24px 16px;text-align:center}header h1{margin:0 0 6px;font-size:clamp(22px,4vw,32px)}header p{margin:0;color:#e5edf7}
.wrap{max-width:900px;margin:18px auto;padding:0 12px}.toolbar{position:sticky;top:0;z-index:5;background:#fff;border:1px solid #d7e0eb;border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:0 2px 8px #12315b12}
.progress{height:8px;background:#e5eaf1;border-radius:99px;overflow:hidden;margin-top:9px}.bar{height:100%;width:0;background:var(--blue);transition:width .2s}
.card{background:#fff;border:1px solid #dce4ee;border-radius:14px;padding:16px;margin:14px 0;box-shadow:0 3px 12px #12315b0a}.qhead{display:flex;gap:10px;align-items:flex-start}.num{background:var(--pale);color:var(--navy);font-weight:bold;border-radius:8px;padding:4px 9px;white-space:nowrap}.question{font-weight:700;margin:2px 0 12px}.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid #dce4ee;border-radius:9px;padding:10px;margin:8px 0;cursor:pointer}.opt:hover{background:#f7faff}.opt input{margin-top:5px;accent-color:var(--blue)}.opt.correct{border-color:#6ba889;background:#edf8f1}.opt.wrong{border-color:#d98989;background:#fff0f0}.source{font-size:12px;color:#687386;margin-top:10px}.feedback{font-weight:700;margin-top:8px}.muted{color:#687386;font-size:13px}button{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff}button.secondary{background:#e8eef6;color:var(--navy)}button:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.result{display:none;background:#fff;border:2px solid var(--blue);border-radius:14px;padding:18px;margin:18px 0}.result h2{margin-top:0;color:var(--navy)}.pill{background:var(--pale);color:var(--navy);padding:5px 9px;border-radius:99px;font-weight:700}
@media print{body{background:#fff}.toolbar,.actions,button{display:none!important}.card{break-inside:avoid;box-shadow:none}header{background:#fff;color:#000;border-bottom:2px solid #12315b}.result{display:block!important}}
</style>
</head>
<body>
<header><h1>DPWCS — 50 MCQ Interactive Quiz</h1><p>E‑TRO Darpan · October 2026 · उत्तर जाँच सहित</p></header>
<main class="wrap">
<div class="toolbar"><div><strong id="progressText">0 / 50 उत्तर दिए</strong><div class="progress"><div class="bar" id="bar"></div></div></div><div><button class="secondary" onclick="showAllAnswers()">सभी उत्तर दिखाएँ</button></div></div>
<p class="muted">हर प्रश्न में एक विकल्प चुनें। “उत्तर जाँचें” दबाने पर स्कोर और सही उत्तर दिखाई देंगे। प्रश्न मूल PDF के विषयों पर आधारित हैं।</p>
<div id="quiz"></div>
<div class="actions"><button onclick="checkAnswers()">उत्तर जाँचें / स्कोर देखें</button><button class="secondary" onclick="resetQuiz()">फिर से शुरू करें</button><button class="secondary" onclick="window.print()">प्रिंट / PDF सेव करें</button></div>
<section class="result" id="result"><h2>आपका परिणाम</h2><p id="score"></p><p id="summary"></p></section>
</main>
<script>
const questions = [{"q": "DPWCS का पूरा नाम क्या है?", "options": ["Distributed Power Wireless Control System", "Digital Power Wire Control System", "Distributed Pantograph Warning Control System", "Driver Power Wireless Communication Setup"], "answer": 0, "source": "PDF पेज 2"}, {"q": "PDF के अनुसार DPWCS लोको में लोकोमोटिव का युग्मन मुख्यतः किस माध्यम से होता है?", "options": ["लंबी केबल से", "Radio Frequency (RF) से", "केवल मोबाइल नेटवर्क से", "ऑप्टिकल फाइबर से"], "answer": 1, "source": "PDF पेज 2"}, {"q": "DPWCS का प्रमुख लाभ क्या बताया गया है?", "options": ["हर रिमोट लोको में अलग चालक आवश्यक है", "लीडिंग लोको से रिमोट लोको को RF द्वारा कमांड दी जा सकती है", "केवल स्टेशन पर काम करता है", "केवल ब्रेकिंग बंद करता है"], "answer": 1, "source": "PDF पेज 2"}, {"q": "DPWCS में Driver Display Unit (DDU) कितने होते हैं?", "options": ["1", "2—प्रत्येक कैब में एक", "3", "4"], "answer": 1, "source": "PDF पेज 2"}, {"q": "PDF में Control & Communication Unit की संख्या कितनी दी गई है?", "options": ["1", "2", "3", "4"], "answer": 0, "source": "PDF पेज 2"}, {"q": "इनमें से कौन-सा उपकरण PDF की DPWCS सूची में शामिल है?", "options": ["Pressure Sensor Box", "GPS camera", "Wi-Fi router", "Fuel injector"], "answer": 0, "source": "PDF पेज 2"}, {"q": "Remote loco की प्रारंभिक तैयारी में MR pressure कितना बनाने को कहा गया है?", "options": ["4–5 kg/cm²", "6–7 kg/cm²", "8–10 kg/cm²", "10–12 kg/cm²"], "answer": 2, "source": "PDF पेज 3"}, {"q": "Remote loco की तैयारी के दौरान VCB और pantograph के बारे में क्या निर्देश है?", "options": ["दोनों ऊपर/बंद रखें", "VCB open और pantograph lower करें", "केवल VCB close करें", "केवल pantograph raise करें"], "answer": 1, "source": "PDF पेज 3"}, {"q": "Remote loco की तैयारी में A-9 handle किस स्थिति में रखने को कहा गया है?", "options": ["Full Service", "Emergency", "Neutral", "Release"], "answer": 2, "source": "PDF पेज 3"}, {"q": "Remote loco की तैयारी में कौन-सी NODE information सुनिश्चित करने को कहा गया है?", "options": ["504", "570", "612", "900"], "answer": 2, "source": "PDF पेज 3"}, {"q": "PDF के अनुसार दोनों कैब में SA-9 किस स्थिति में रहेगा?", "options": ["Apply", "Release", "Emergency", "Isolate"], "answer": 1, "source": "PDF पेज 3"}, {"q": "DPWCS की MCB Remote loco में कहाँ बताई गई है?", "options": ["Cab-1 में ड्राइवर के सामने", "Cab-2 में ALP के पीछे", "बैटरी बॉक्स के बाहर", "इंजन रूम की छत पर"], "answer": 1, "source": "PDF पेज 3"}, {"q": "PDF में Driver ID के लिए क्या भरने को कहा गया है?", "options": ["छह अंकों की ID", "LP की चार अंकों की ID", "लोको नंबर", "ट्रेन का नाम"], "answer": 1, "source": "PDF पेज 3"}, {"q": "PDF में DPWCS login का common password क्या दिया गया है?", "options": ["1234", "0000", "2400", "5040"], "answer": 2, "source": "PDF पेज 3"}, {"q": "Train Name field में क्या भर सकते हैं?", "options": ["केवल स्टेशन कोड", "ट्रेन का नंबर या नाम", "केवल लोको नंबर", "केवल Driver ID"], "answer": 1, "source": "PDF पेज 3"}, {"q": "Remote loco configuration में Lead/Remote विकल्प क्या चुनना है?", "options": ["LEAD", "REMOTE", "IDLE", "ISOLATE"], "answer": 1, "source": "PDF पेज 4"}, {"q": "Loco Orientation में क्या चुनना है?", "options": ["कोई भी कैब", "ड्राइविंग कैब, दिशा-ए-ट्रैफिक के अनुसार", "हमेशा Cab-1", "हमेशा Cab-2"], "answer": 1, "source": "PDF पेज 4"}, {"q": "Remote loco configuration में Lead Loco Number field में क्या आता है?", "options": ["Remote loco का नंबर", "Leading loco का नंबर", "ट्रेन के वैगन की संख्या", "Driver ID"], "answer": 1, "source": "PDF पेज 4"}, {"q": "Configuration भरने के बाद confirmation में कौन-सा विकल्प चुनने को कहा गया है?", "options": ["NO", "CANCEL", "YES", "BACK"], "answer": 2, "source": "PDF पेज 4"}, {"q": "Lead loco configuration में Lead/Remote विकल्प क्या चुनना है?", "options": ["REMOTE", "LEAD", "IDLE", "FAULT ACK"], "answer": 1, "source": "PDF पेज 6"}, {"q": "Total No. of Remote Locos field किस जानकारी के लिए है?", "options": ["कुल वैगन", "रिमोट लोको की कुल संख्या", "कुल क्रू", "ब्रेक वैन की संख्या"], "answer": 1, "source": "PDF पेज 6"}, {"q": "यदि दो remote locos हों तो Total No. of Remote Locos में क्या दर्ज होगा?", "options": ["0", "1", "2", "3"], "answer": 2, "source": "PDF पेज 6"}, {"q": "Remote-1 Loco Number field में क्या भरना है?", "options": ["पहले remote loco का नंबर", "Leading loco का नंबर", "ट्रेन का नंबर", "Driver ID"], "answer": 0, "source": "PDF पेज 6"}, {"q": "दोनों लोको के बीच कोई वैगन न हो तो कौन-सा विकल्प चुनना बताया गया है?", "options": ["Wagon Selection", "No Wagon", "Fault Ack", "Move to Back"], "answer": 1, "source": "PDF पेज 7"}, {"q": "Wagon Selection में किस आधार पर वैगन संख्या भरनी है?", "options": ["रंग के अनुसार", "Wagon type के अनुसार", "केवल ट्रेन नंबर के अनुसार", "केवल कुल वजन के अनुसार"], "answer": 1, "source": "PDF पेज 7"}, {"q": "Wagon Selection screen में selection cancel करने के लिए कौन-सी key बताई गई है?", "options": ["ENTER", "ESC", "SHIFT", "F1"], "answer": 1, "source": "PDF पेज 7"}, {"q": "Wagon selection के बाद मूल PDF में ENTER key कितनी बार दबाने को कहा गया है?", "options": ["एक बार", "दो बार", "तीन बार", "दबाने की जरूरत नहीं"], "answer": 1, "source": "PDF पेज 7"}, {"q": "BP Continuity Check screen पर प्रारंभिक अवस्था में RF status के सामने क्या दिखाई दे सकता है?", "options": ["Linked", "Offline", "कुछ नहीं/डैश", "Fault 504"], "answer": 2, "source": "PDF पेज 8"}, {"q": "BP Continuity प्रक्रिया के लिए Leading loco में A-9 को किस स्थिति में रखने को कहा गया है?", "options": ["Release", "Full Service", "Emergency", "Neutral"], "answer": 1, "source": "PDF पेज 8"}, {"q": "BP Continuity के दौरान PDF में दोनों लोको के BP status पर कौन-सा मान दिखाया गया है?", "options": ["1.5 kg/cm²", "2.5 kg/cm²", "3.5 kg/cm²", "8.0 kg/cm²"], "answer": 2, "source": "PDF पेज 9"}, {"q": "BP Continuity पूरा होने के बाद A-9 handle को किस स्थिति में ले जाने को कहा गया है?", "options": ["Release", "Emergency", "Full Service", "Neutral"], "answer": 0, "source": "PDF पेज 9"}, {"q": "PDF में Operation window के लिए कुल कितने modes बताए गए हैं?", "options": ["4", "5", "6", "8"], "answer": 2, "source": "PDF पेज 10"}, {"q": "इनमें से कौन-सा mode PDF की सूची में शामिल है?", "options": ["Mode Selection", "Fuel Calibration", "GPS Setup", "Battery Reset"], "answer": 0, "source": "PDF पेज 10"}, {"q": "Synchronize Mode का मुख्य कार्य क्या बताया गया है?", "options": ["Remote loco को पूरी तरह बंद करना", "Leading loco के operation को remote loco के साथ synchronize करना", "केवल buzzer बंद करना", "Wagon count बदलना"], "answer": 1, "source": "PDF पेज 11"}, {"q": "Idle Mode में remote loco के किस operation को electrically बंद करने की बात कही गई है?", "options": ["Traction और braking", "केवल headlight", "केवल horn", "केवल radio"], "answer": 0, "source": "PDF पेज 11"}, {"q": "BV OUT mode का प्रभाव PDF के अनुसार क्या है?", "options": ["Remote loco में BP charging बंद हो जाती है", "Remote loco का horn बंद होता है", "Lead loco isolate होता है", "Wagon count शून्य हो जाता है"], "answer": 0, "source": "PDF पेज 12"}, {"q": "Isolate Mode में PDF के अनुसार remote loco में कौन-सा handle काम करेगा?", "options": ["SA-9", "A-9", "BL-Key", "Reverser"], "answer": 1, "source": "PDF पेज 12"}, {"q": "Brake Mode में remote loco को क्या command दी जाती है?", "options": ["केवल traction", "केवल braking (RG), traction नहीं", "traction और braking दोनों", "सभी controls बंद"], "answer": 1, "source": "PDF पेज 12"}, {"q": "Independent Control में दोनों locos कैसे काम करते हैं?", "options": ["केवल lead loco काम करता है", "दोनों अलग-अलग/individual रूप से operate किए जा सकते हैं", "दोनों हमेशा synchronized रहते हैं", "दोनों shutdown रहते हैं"], "answer": 1, "source": "PDF पेज 13"}, {"q": "Independent Control screen पर remote loco को individual group से operate करने के लिए कौन-सा विकल्प बताया गया है?", "options": ["Move to Front", "Move to Back", "No Wagon", "Neutral Section Cancelation"], "answer": 1, "source": "PDF पेज 13"}, {"q": "Traction बढ़ाने के लिए Go to Traction के बाद कौन-सा विकल्प चुनना है?", "options": ["Less", "More", "Release", "Cancel"], "answer": 1, "source": "PDF पेज 14"}, {"q": "Pantograph नीचे करने के लिए कौन-सा विकल्प चुनना बताया गया है?", "options": ["Panto UP", "Panto Down", "VCB Close", "Sanding"], "answer": 1, "source": "PDF पेज 14"}, {"q": "Remote/Reboot का उपयोग PDF के अनुसार किस स्थिति में करना है?", "options": ["चलती ट्रेन में", "ट्रेन खड़ी होने पर", "केवल neutral section में", "केवल स्टेशन यार्ड में"], "answer": 1, "source": "PDF पेज 15"}, {"q": "PDF के अनुसार rebooting पूर्ण होने का संकेत कौन-सा NODE information है?", "options": ["504", "570", "612", "2400"], "answer": 0, "source": "PDF पेज 15"}, {"q": "Fault Acknowledgement के बाद remote loco की NODE information किस मान पर आने की बात कही गई है?", "options": ["504", "612", "999", "2400"], "answer": 0, "source": "PDF पेज 16"}, {"q": "Ungrouping से पहले PDF के अनुसार ट्रेन की स्थिति क्या होनी चाहिए?", "options": ["चलती हुई", "खड़ी हुई", "Neutral section में", "ढलान पर"], "answer": 1, "source": "PDF पेज 16"}, {"q": "Buzzer switch का उपयोग किसलिए बताया गया है?", "options": ["Wagon count बदलने के लिए", "खराबी के message के साथ बजने वाले buzzer को बंद करने के लिए", "VCB close करने के लिए", "Driver ID बदलने के लिए"], "answer": 1, "source": "PDF पेज 18"}, {"q": "Neutral Section Negotiation Switch (NSN) को कब press करने को कहा गया है?", "options": ["Neutral section पार करने के बाद", "250 मीटर बोर्ड आने पर", "500 मीटर बोर्ड पर", "ट्रेन रोकने के बाद ही"], "answer": 1, "source": "PDF पेज 18"}, {"q": "Grouping के समय DDU status के बारे में क्या ध्यान रखना है?", "options": ["DDU Offline होना चाहिए", "DDU Online दिखना चाहिए", "Status जरूरी नहीं", "केवल NODE 612 दिखना चाहिए"], "answer": 1, "source": "PDF पेज 19"}, {"q": "यदि grouping के बाद ट्रेन की दिशा बदलनी हो, तो PDF के अनुसार क्या करना चाहिए?", "options": ["सीधे direction बदल दें", "दोनों locos ungroup करके direction के अनुसार lead/remote तय कर फिर grouping करें", "केवल remote loco का pantograph बदलें", "केवल driver ID बदलें"], "answer": 1, "source": "PDF पेज 20"}];
const letters = ["A","B","C","D"];
const quiz = document.getElementById("quiz");
questions.forEach((item,i)=>{
 const card=document.createElement("section");card.className="card";card.id="qcard"+i;
 const head=document.createElement("div");head.className="qhead";
 const num=document.createElement("span");num.className="num";num.textContent="Q"+(i+1);
 const q=document.createElement("div");q.className="question";q.textContent=item.q;
 head.append(num,q);card.append(head);
 item.options.forEach((opt,j)=>{
  const label=document.createElement("label");label.className="opt";label.id=`opt-${i}-${j}`;
  const input=document.createElement("input");input.type="radio";input.name="q"+i;input.value=j;input.addEventListener("change",updateProgress);
  const text=document.createElement("span");text.textContent=letters[j]+". "+opt;
  label.append(input,text);card.append(label);
 });
 const source=document.createElement("div");source.className="source";source.textContent="स्रोत: "+item.source;card.append(source);
 const feedback=document.createElement("div");feedback.className="feedback";feedback.id="feedback"+i;card.append(feedback);
 quiz.append(card);
});
function updateProgress(){let n=0;questions.forEach((_,i)=>{if(document.querySelector(`input[name="q${i}"]:checked`))n++});document.getElementById("progressText").textContent=n+" / "+questions.length+" उत्तर दिए";document.getElementById("bar").style.width=(n/questions.length*100)+"%"}
function checkAnswers(){
 let score=0,answered=0;
 questions.forEach((item,i)=>{
  const chosen=document.querySelector(`input[name="q${i}"]:checked`);
  const fb=document.getElementById("feedback"+i);
  item.options.forEach((_,j)=>{const el=document.getElementById(`opt-${i}-${j}`);el.classList.remove("correct","wrong");if(j===item.answer)el.classList.add("correct")});
  if(chosen){answered++;if(Number(chosen.value)===item.answer)score++;else document.getElementById(`opt-${i}-${chosen.value}`).classList.add("wrong")}
  fb.textContent="सही उत्तर: "+letters[item.answer]+". "+item.options[item.answer];
 });
 const result=document.getElementById("result");result.style.display="block";
 document.getElementById("score").textContent=`स्कोर: ${score} / ${questions.length} (${Math.round(score/questions.length*100)}%)`;
 document.getElementById("summary").textContent=`आपने ${answered} प्रश्नों के उत्तर दिए। सही विकल्प हरे और चुने गए गलत विकल्प लाल रंग में दिखाए गए हैं।`;
 result.scrollIntoView({behavior:"smooth",block:"start"});
}
function showAllAnswers(){questions.forEach((item,i)=>{document.getElementById("feedback"+i).textContent="सही उत्तर: "+letters[item.answer]+". "+item.options[item.answer];item.options.forEach((_,j)=>{if(j===item.answer)document.getElementById(`opt-${i}-${j}`).classList.add("correct")})})}
function resetQuiz(){document.querySelectorAll('input[type="radio"]').forEach(x=>x.checked=false);questions.forEach((item,i)=>{document.getElementById("feedback"+i).textContent="";item.options.forEach((_,j)=>document.getElementById(`opt-${i}-${j}`).classList.remove("correct","wrong"))});document.getElementById("result").style.display="none";updateProgress();window.scrollTo({top:0,behavior:"smooth"})}
</script>
</body>
</html>
